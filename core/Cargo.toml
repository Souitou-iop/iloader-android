[package]
name = "iloader-core"
version = "2.3.8"
description = "iloader backend without any UI framework"
authors = ["nab138"]
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "0.1.68", features = ["usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
isideload = { version = "0.4.6", features = ["fs-storage"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
futures = "0.3.31"
reqwest = "0.13.2"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
chrono = "0.4"
tracing-subscriber = "0.3.22"
tracing = "0.1.44"
tracing-appender = "0.2"
plist = "1.8.0"
plist-macro = "0.1.6"
tokio-util = "0.7.18"
rootcause = "0.12.1"
thiserror = "2.0.18"
strum = { version = "0.28.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"
